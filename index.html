<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Agentic Tetris">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="A fast, responsive Tetris PWA for iPhone and desktop browsers.">
    <title>Agentic Tetris</title>
    <link rel="icon" href="./assets/icons/app-icon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.svg">
    <style>
      :root {
        color-scheme: dark;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        background: #0d0d0d;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #0d0d0d;
      }

      body {
        min-width: 320px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        -webkit-user-select: none;
        user-select: none;
      }

      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        width: 100vw;
        height: 100vh;
        padding: 0;
        box-sizing: border-box;
        touch-action: none;
        overscroll-behavior: none;
        overflow: hidden;
      }

      #game-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #0d0d0d;
        touch-action: none;
      }

      .prompt {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding:
          max(24px, var(--safe-top))
          max(24px, var(--safe-right))
          max(24px, var(--safe-bottom))
          max(24px, var(--safe-left));
        box-sizing: border-box;
        color: #f5f5f5;
        background: #0d0d0d;
        text-align: center;
        font-size: 18px;
        line-height: 1.4;
        z-index: 10;
      }

      @media (orientation: landscape) and (max-width: 899px) {
        #rotate-prompt {
          display: grid;
        }
      }

      @media (max-width: 419px) and (min-aspect-ratio: 1 / 1) {
        #widen-prompt {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" width="320" height="640" aria-label="Agentic Tetris game canvas"></canvas>
    </main>
    <div id="rotate-prompt" class="prompt" role="status">Rotate to portrait to continue.</div>
    <div id="widen-prompt" class="prompt" role="status">Widen the window to continue.</div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
